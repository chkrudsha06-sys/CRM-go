name: Bunyangline Data Crawler

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'backfill은 7월 1일부터 전체 수집, incremental은 최근 3일만 갱신'
        required: true
        default: backfill
        type: choice
        options:
          - backfill
          - incremental
  schedule:
    - cron: '0 1,5,9 * * *'

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install crawler dependencies
        working-directory: tools/bunyangline-crawler
        run: npm install

      - name: Run Bunyangline crawler
        working-directory: tools/bunyangline-crawler
        env:
          CRM_BUNYANGLINE_IMPORT_URL: ${{ secrets.CRM_BUNYANGLINE_IMPORT_URL }}
          BUNYANGLINE_IMPORT_SECRET: ${{ secrets.BUNYANGLINE_IMPORT_SECRET }}
          BUNYANGLINE_REGION_IDS: '0'
          BUNYANGLINE_START_DATE: '2026-07-01'
          BUNYANGLINE_CRAWL_MODE: ${{ github.event_name == 'schedule' && 'incremental' || inputs.mode }}
          BUNYANGLINE_LOOKBACK_DAYS: '3'
          BUNYANGLINE_MAX_PAGES: '500'
          BUNYANGLINE_DETAIL_CONCURRENCY: '4'
          BUNYANGLINE_REQUEST_DELAY_MS: '150'
          BUNYANGLINE_BATCH_SIZE: '20'
          BUNYANGLINE_DETAIL_TEXT_MAX_LENGTH: '20000'
          BUNYANGLINE_RAW_TEXT_MAX_LENGTH: '8000'
          SEND_TO_CRM: 'true'
        run: npm run start

      - name: Enrich Bunyangline site info from detail text
        env:
          CRM_BUNYANGLINE_IMPORT_URL: ${{ secrets.CRM_BUNYANGLINE_IMPORT_URL }}
          CRM_BUNYANGLINE_ENRICH_URL: ${{ secrets.CRM_BUNYANGLINE_ENRICH_URL }}
          BUNYANGLINE_IMPORT_SECRET: ${{ secrets.BUNYANGLINE_IMPORT_SECRET }}
        run: |
          if [ -n "$CRM_BUNYANGLINE_ENRICH_URL" ]; then
            ENRICH_URL="$CRM_BUNYANGLINE_ENRICH_URL"
          elif [ -n "$CRM_BUNYANGLINE_IMPORT_URL" ]; then
            ENRICH_URL="${CRM_BUNYANGLINE_IMPORT_URL%/api/bunyangline-data/import}/api/bunyangline-data/enrich-site-info"
          else
            echo "CRM_BUNYANGLINE_IMPORT_URL이 없어 보강 작업을 건너뜁니다."
            exit 0
          fi

          curl -fsS -X POST "$ENRICH_URL" \
            -H "Content-Type: application/json" \
            -H "x-import-secret: $BUNYANGLINE_IMPORT_SECRET" \
            --data '{"limit":2000}' \
            | tee bunyangline-enrich-result.json

      - name: Upload Bunyangline debug output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bunyangline-debug-output
          path: tools/bunyangline-crawler/debug-output
          if-no-files-found: warn
          retention-days: 7
