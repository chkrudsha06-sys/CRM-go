name: Bunyangline Data Crawler

on:
  workflow_dispatch:
  schedule:
    # UTC 기준입니다. 한국시간 10:00 / 14:00 / 18:00 실행
    - cron: '0 1,5,9 * * *'

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install crawler dependencies
        working-directory: tools/bunyangline-crawler
        run: npm install

      - name: Install Playwright browser
        working-directory: tools/bunyangline-crawler
        run: npm run install:browser

      - name: Run Bunyangline crawler
        working-directory: tools/bunyangline-crawler
        env:
          CRM_BUNYANGLINE_IMPORT_URL: ${{ secrets.CRM_BUNYANGLINE_IMPORT_URL }}
          BUNYANGLINE_IMPORT_SECRET: ${{ secrets.BUNYANGLINE_IMPORT_SECRET }}
          BUNYANGLINE_REGION_IDS: all
          BUNYANGLINE_MAX_PAGES: '1'
          BUNYANGLINE_SCROLL_ROUNDS: '80'
          BUNYANGLINE_SEND_TO_CRM: 'true'
          HEADLESS: 'true'
        run: npm run start

      - name: Upload Bunyangline debug output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bunyangline-debug-output
          path: tools/bunyangline-crawler/debug-output
          if-no-files-found: warn
          retention-days: 7
