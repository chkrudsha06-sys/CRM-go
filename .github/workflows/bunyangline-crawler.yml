name: Bunyangline Data Crawler

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron은 UTC 기준입니다.
    # 한국시간 11:59 = UTC 02:59
    # 한국시간 23:59 = UTC 14:59
    - cron: '59 2,14 * * *'

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install crawler dependencies
        working-directory: tools/bunyangline-crawler
        run: npm install

      - name: Install Playwright browser
        working-directory: tools/bunyangline-crawler
        run: npm run install:browser

      - name: Run Bunyangline crawler
        working-directory: tools/bunyangline-crawler
        env:
          CRM_BUNYANGLINE_IMPORT_URL: ${{ secrets.CRM_BUNYANGLINE_IMPORT_URL }}
          BUNYANGLINE_IMPORT_SECRET: ${{ secrets.BUNYANGLINE_IMPORT_SECRET }}
          BUNYANGLINE_REGION_IDS: all
          BUNYANGLINE_MAX_PAGES: '1'
          BUNYANGLINE_MAX_DETAILS_PER_REGION: '30'
          BUNYANGLINE_MIN_POSTED_AT: '2026-05-01'
          BUNYANGLINE_INCREMENTAL: 'true'
          BUNYANGLINE_IMPORT_BATCH_SIZE: '2'
          BUNYANGLINE_MAX_DETAIL_TEXT_LENGTH: '7000'
          BUNYANGLINE_MAX_RAW_TEXT_LENGTH: '0'
          HEADLESS: 'true'
        run: npm run start
